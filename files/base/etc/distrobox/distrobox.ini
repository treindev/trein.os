# /etc/distrobox/distrobox.ini
# Declarative Devbox manifest for trein.os
# Reference: ADR-0001 (Distrobox-first development environment)

[devbox]
image=registry.fedoraproject.org/fedora-toolbox:latest
nvidia=true
pull=true
start_now=false

# Pre-initialization: configure external repositories and signing keys before package installation (idempotent, offline-safe)
pre_init_hooks="test -f /etc/yum.repos.d/vscode.repo || (sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc && printf '[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\nautorefresh=1\ntype=rpm-md\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc\n' | sudo tee /etc/yum.repos.d/vscode.repo > /dev/null)"

# Additional packages to install inside the container
additional_packages="git fish curl code"

# Post-initialization hooks: idempotent installations for IDEs and CLI tools
init_hooks="test -L /usr/local/bin/xdg-open || sudo ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/xdg-open; test -L /usr/local/bin/podman || sudo ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman; test -L /usr/local/bin/podman-compose || sudo ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman-compose; test -L /usr/local/bin/docker || sudo ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/docker; test -e /etc/profile.d/podman-socket.sh || ! test -f /run/host/etc/profile.d/podman-socket.sh || sudo ln -sf /run/host/etc/profile.d/podman-socket.sh /etc/profile.d/podman-socket.sh; test -e /usr/share/fish/vendor_conf.d/podman-socket.fish || ! test -f /run/host/usr/share/fish/vendor_conf.d/podman-socket.fish || (sudo mkdir -p /usr/share/fish/vendor_conf.d && sudo ln -sf /run/host/usr/share/fish/vendor_conf.d/podman-socket.fish /usr/share/fish/vendor_conf.d/podman-socket.fish); command -v zed >/dev/null 2>&1 || curl -f https://zed.dev/install.sh | sh; command -v agy >/dev/null 2>&1 || curl -fsSL https://antigravity.google/cli/install.sh | bash; command -v antigravity >/dev/null 2>&1 || /run/host/usr/libexec/devbox-init-antigravity"

# Exported desktop applications (makes them visible in the host desktop application launcher)
exported_apps="code zed antigravity"

# Exported binaries (makes them available directly in host shells via ~/.local/bin)
exported_bins="/usr/bin/code /usr/local/bin/antigravity"


