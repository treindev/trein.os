# /etc/distrobox/distrobox.ini
# Declarative Devbox manifest for trein.os
# Reference: ADR-0001 (Distrobox-first development environment)

[devbox]
image=registry.fedoraproject.org/fedora-toolbox:latest
nvidia=true
pull=true
start_now=false

# Pre-initialization: configure external repositories and signing keys before package installation (idempotent, offline-safe)
pre_init_hooks="test -f /etc/yum.repos.d/vscode.repo || (sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc && printf '[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\nautorefresh=1\ntype=rpm-md\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc\n' | sudo tee /etc/yum.repos.d/vscode.repo > /dev/null)"

# Additional packages to install inside the container
additional_packages="git fish curl code"

# Post-initialization hooks: idempotent installations for IDEs and CLI tools
init_hooks="command -v zed >/dev/null 2>&1 || curl -f https://zed.dev/install.sh | sh; command -v agy >/dev/null 2>&1 || curl -fsSL https://antigravity.google/cli/install.sh | bash; command -v antigravity >/dev/null 2>&1 || (sudo mkdir -p /opt/antigravity && curl -fsSL https://storage.googleapis.com/antigravity-public/antigravity-hub/2.15.0-6576870427328512/linux-x64/Antigravity.tar.gz | sudo tar -xz -C /opt/antigravity --strip-components=1 && sudo chown -R $(id -u):$(id -g) /opt/antigravity && printf '#!/usr/bin/env bash\nexec /opt/antigravity/antigravity --ozone-platform-hint=auto \x22\$@\x22\n' | sudo tee /usr/local/bin/antigravity >/dev/null && sudo chmod +x /usr/local/bin/antigravity && (sudo curl -fsSL https://antigravity.google/assets/image/antigravity-logo.png -o /usr/share/pixmaps/antigravity.png 2>/dev/null || true) && printf '[Desktop Entry]\nName=Antigravity\nGenericName=AI Agent Command Center\nComment=Antigravity - Agentic Desktop Application\nExec=/usr/local/bin/antigravity %%U\nIcon=antigravity\nTerminal=false\nType=Application\nCategories=Development;IDE;\nStartupWMClass=antigravity\n' | sudo tee /usr/share/applications/antigravity.desktop >/dev/null)"

# Exported desktop applications (makes them visible in the host desktop application launcher)
exported_apps="code zed antigravity"

# Exported binaries (makes them available directly in host shells via ~/.local/bin)
exported_bins="/usr/bin/code /usr/local/bin/antigravity"


