# /etc/distrobox/distrobox.ini
# Declarative Devbox manifest for trein.os
# Reference: ADR-0001 (Distrobox-first development environment)

[devbox]
image=registry.fedoraproject.org/fedora-toolbox:latest
nvidia=true
pull=true
start_now=false

# Pre-initialization: configure external repositories and signing keys before package installation
pre_init_hooks="sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc && printf '[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\nautorefresh=1\ntype=rpm-md\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc\n' | sudo tee /etc/yum.repos.d/vscode.repo > /dev/null"

# Additional packages to install inside the container
additional_packages="git fish curl code"

# Post-initialization hooks: idempotent installations for IDEs and CLI tools
init_hooks="command -v zed >/dev/null 2>&1 || curl -f https://zed.dev/install.sh | sh; command -v agy >/dev/null 2>&1 || curl -fsSL https://antigravity.google/cli/install.sh | bash"

# Exported desktop applications (makes them visible in the host desktop application launcher)
exported_apps="code zed"

# Exported binaries (makes them available directly in host shells via ~/.local/bin)
exported_bins="/usr/bin/code"
