---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: trein.os
description: Atomic niri desktop environment with dms. Based on Fedora 44

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # Static Configuration & Root Files (Infrequent changes)
  - type: files
    files:
      - source: system
        destination: /

  # Static Fonts (Infrequent changes)
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Roboto
        - Open Sans
        - Inter

  # Kernel Drivers
  - type: akmods
    nvidia-driver: nvidia
    install: []

  # Core System Packages & Virtualization (Stable, rarely changes)
  - type: dnf
    install:
      packages:
        - distrobox
        - btop
        - fish
        - ddcutil
        - mako
        - xdg-desktop-portal-gnome
        - gnome-keyring
        - nautilus
        - polkit-kde
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-kvm
        - virt-install
        - virt-manager
        - power-profiles-daemon
        - flameshot
        - bolt
    remove:
      packages:
        - firefox
      auto-remove: true

  # Fast-Moving / COPR Packages (Frequent updates)
  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - scottames/ghostty
    install:
      packages:
        - niri
        - dms
        - dms-greeter
        - ghostty
      exclude:
        - waybar
        - alacritty

  # Service Integration & Symlinks
  - type: systemd
    system:
      enabled:
        - greetd.service
    user:
      enabled:
        - mako.service
        - plasma-polkit-agent.service
        - init-devbox.service

  - type: script
    snippets:
      - mkdir -p /etc/systemd/user/niri.service.wants
      - ln -s /usr/lib/systemd/user/dms.service /etc/systemd/user/niri.service.wants/dms.service

  # Flatpaks & Final Signing
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.valvesoftware.Steam
          - com.usebottles.bottles
          - org.prismlauncher.PrismLauncher
          - com.discordapp.Discord
          - org.fedoraproject.MediaWriter
          - com.actualbudget.actual
          - com.calibre_ebook.calibre
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal

  - type: signing