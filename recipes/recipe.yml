---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/treindev/trein.os
name: trein.os
description: Atomic niri desktop environment with dms and nvidia. Based on Fedora 44

base-image: ghcr.io/ublue-os/base-nvidia
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* the image's root folder /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Roboto
        - Open Sans
        - Inter

  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - scottames/ghostty
    install:
      packages:
        - niri
        - dms
        - dms-greeter
        - code
        - btop
        - fish
        - ghostty
        - ddcutil
        - mako
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        - gnome-keyring
        - nautilus
        - plasma-polkit-agent

  - type: systemd
    system:
      disabled:
        - gdm
        - lightdm
        - sddm
      enabled:
        - greetd.service
        - plasma-polkit-agent.service
    user:
      enabled:
        - mako.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
      - scope: user
        install:
          - com.valvesoftware.Steam
          - com.usebottles.bottles
          - org.freedesktop.Platform.VulkanLayer.gamescope
          - org.prismlauncher.PrismLauncher
          - com.discordapp.Discord
          - org.fedoraproject.MediaWriter
          - com.actualbudget.actual

  - type: signing
