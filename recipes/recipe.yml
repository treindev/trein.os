---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/treindev/trein.os
name: trein.os
description: Atomic niri desktop environment with dms. Based on Fedora 44

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* the image's root folder /

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - akmod-nvidia-580xx
        - xorg-x11-drv-nvidia-580xx
        - xorg-x11-drv-nvidia-580xx-cuda
        - xorg-x11-drv-nvidia-580xx-power

  - type: kargs
    kargs:
      - rd.driver.blacklist=nouveau
      - modprope.blacklist=nouveau
      - nvidia-drm.modeset=1

  - type: systemd
    system:
      enabled:
        - nvidia-hibernate.service
        - nvidia-suspend.service
        - nvidia-resume.service
        - nvidia-powerd.service

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Roboto
        - Open Sans
        - Inter

  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - scottames/ghostty
    install:
      packages:
        - niri
        - dms
        - dms-greeter
        - distrobox
        - btop
        - fish
        - ghostty
        - ddcutil
        - mako
        - xdg-desktop-portal-gnome
        - gnome-keyring
        - nautilus
        - polkit-kde
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-kvm
        - virt-install
        - virt-manager
        - power-profiles-daemon
        - flameshot
      exclude:
        - waybar
        - alacritty
    remove:
      packages:
        - firefox
      auto-remove: true

  - type: systemd
    system:
      enabled:
        - greetd.service
    user:
      enabled:
        - mako.service
        - plasma-polkit-agent.service
        - init-devbox.service

  - type: script
    snippets:
      - mkdir -p /etc/systemd/user/niri.service.wants
      - ln -s /usr/lib/systemd/user/dms.service /etc/systemd/user/niri.service.wants/dms.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.valvesoftware.Steam
          - com.usebottles.bottles
          - org.prismlauncher.PrismLauncher
          - com.discordapp.Discord
          - org.fedoraproject.MediaWriter
          - com.actualbudget.actual
          - com.calibre_ebook.calibre
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal

  - type: signing
